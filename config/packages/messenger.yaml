framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine transport keeps the demo infrastructure small.
            # In production this would be Kafka / SQS / RabbitMQ - only the DSN changes.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
                    max_delay: 60000
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            App\Message\ProcessWebhookEvent: async
            App\Message\CheckPaymentStatus: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
