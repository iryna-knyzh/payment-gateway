# docker compose up -d
#   app        http://localhost:8000   - the payment gateway (Symfony)
#   worker                             - messenger:consume (webhooks, status checks)
#   simulator  http://localhost:8081   - fake FakeBank / QuickPay
#   database   localhost:5433          - PostgreSQL 16

x-app-env: &app-env
    DATABASE_URL: "postgresql://app:app@database:5432/payments?serverVersion=16&charset=utf8"
    FAKEBANK_BASE_URI: "http://simulator:8081/fakebank/"
    QUICKPAY_BASE_URI: "http://simulator:8081/quickpay/"
    # The simulator sends webhooks to this address from inside the Docker network.
    APP_PUBLIC_URL: "http://app:8000"

services:
    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: payments
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5433:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "app", "-d", "payments"]
            interval: 5s
            timeout: 3s
            retries: 10

    app:
        build: .
        command: php -S 0.0.0.0:8000 -t public
        environment: *app-env
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        depends_on:
            database:
                condition: service_healthy

    worker:
        build: .
        # --time-limit: restart the worker regularly so memory leaks cannot accumulate.
        command: php bin/console messenger:consume async -vv --time-limit=3600
        environment: *app-env
        restart: unless-stopped
        volumes:
            - .:/app
        depends_on:
            database:
                condition: service_healthy

    simulator:
        image: php:8.3-cli-alpine
        command: php -S 0.0.0.0:8081 /simulator/index.php
        ports:
            - "8081:8081"
        volumes:
            - ./simulator:/simulator:ro

volumes:
    db-data:
